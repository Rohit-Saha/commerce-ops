server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Default: classpath bake-in from Maven. Override for live monorepo edits:
          # CONFIG_SERVER_SEARCH_LOCATIONS=file:/abs/path/config-repo/,classpath:/config-repo/
          search-locations: ${CONFIG_SERVER_SEARCH_LOCATIONS:classpath:/config-repo/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.config: INFO
