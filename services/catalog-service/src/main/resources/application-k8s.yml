# Activate with SPRING_PROFILES_ACTIVE=k8s.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/catalog_db
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management:
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

commerce:
  catalog:
    inventory-base-url: ${INVENTORY_BASE_URL:http://inventory-service:8082}
    strapi-base-url: ${STRAPI_BASE_URL:http://strapi:1337}
    public-strapi-url: ${STRAPI_PUBLIC_URL:http://strapi:1337}
    elasticsearch-url: ${ELASTICSEARCH_URL:http://elasticsearch:9200}
