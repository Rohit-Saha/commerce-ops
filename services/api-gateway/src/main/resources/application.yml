server:
  port: 8080

spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: api-gateway
  session:
    # Enabled as redis under application-oidc.yml (Auth BFF). Keep none in legacy mode.
    store-type: none

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: api-gateway
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: RECORD

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: api-gateway
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0

commerce:
  security:
    mode: ${COMMERCE_SECURITY_MODE:legacy}
    require-webhook-secrets: ${REQUIRE_WEBHOOK_SECRETS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  customer:
    jwt-secret: ${CUSTOMER_JWT_SECRET:commerce-ops-customer-jwt-dev-secret-change-me}
    jwt-ttl-hours: 12
  gateway:
    services:
      # Localhost defaults for host-run JVMs. On EKS activate profile `k8s`
      # (application-k8s.yml) or override these env vars to Service DNS names.
      order: ${ORDER_SERVICE_URL:http://localhost:8081}
      inventory: ${INVENTORY_SERVICE_URL:http://localhost:8082}
      payment: ${PAYMENT_SERVICE_URL:http://localhost:8083}
      shipping: ${SHIPPING_SERVICE_URL:http://localhost:8084}
      saga: ${SAGA_SERVICE_URL:http://localhost:8085}
      customer: ${CUSTOMER_SERVICE_URL:http://localhost:8087}
      catalog: ${CATALOG_SERVICE_URL:http://localhost:8088}
      invoice: ${INVOICE_SERVICE_URL:http://localhost:8089}
    admin:
      api-key: ${ADMIN_API_KEY:dev-admin-key}
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
    storefront:
      api-key: ${STOREFRONT_API_KEY:storefront-key}
    rate-limit:
      limit: 30
      window-seconds: 60

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      order:
        baseConfig: default
      inventory:
        baseConfig: default
      payment:
        baseConfig: default
      shipping:
        baseConfig: default
      saga:
        baseConfig: default
      customer:
        baseConfig: default
      catalog:
        baseConfig: default
      invoice:
        baseConfig: default

logging:
  level:
    root: INFO
    com.commerceops: INFO
    io.github.resilience4j: INFO
