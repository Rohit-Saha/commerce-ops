# Activate with SPRING_PROFILES_ACTIVE=k8s.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/shipping_db
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management:
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

commerce:
  shipping:
    order-service:
      base-url: ${ORDER_SERVICE_URL:http://order-service:8081}
    saga-service:
      base-url: ${SAGA_SERVICE_URL:http://saga-orchestrator:8085}
