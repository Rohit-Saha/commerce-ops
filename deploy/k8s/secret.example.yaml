# Copy to secret.yaml (gitignored) or create via kubectl (see README).
# Do not commit real production values.
apiVersion: v1
kind: Secret
metadata:
  name: commerce-ops-secrets
  namespace: commerce-ops
  labels:
    app.kubernetes.io/part-of: commerce-ops
type: Opaque
stringData:
  DB_PASSWORD: commerce
  SPRING_DATASOURCE_USERNAME: commerce
  SPRING_DATASOURCE_PASSWORD: commerce
  CUSTOMER_JWT_SECRET: change-me-in-production
  COMMERCE_GATEWAY_ADMIN_API_KEY: dev-admin-key
  COMMERCE_GATEWAY_ADMIN_USERNAME: admin
  COMMERCE_GATEWAY_ADMIN_PASSWORD: admin
  COMMERCE_GATEWAY_STOREFRONT_API_KEY: storefront-key
  # Auth BFF confidential client secrets (must match Keycloak realm clients; change in prod)
  KEYCLOAK_ADMIN_UI_BFF_SECRET: change-me-admin-ui-bff-secret
  KEYCLOAK_STOREFRONT_BFF_SECRET: change-me-storefront-bff-secret
  BFF_ADMIN_FRONTEND_URL: https://admin.example.com
  BFF_STOREFRONT_FRONTEND_URL: https://shop.example.com
