apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-ops-config
  namespace: commerce-ops
  labels:
    app.kubernetes.io/part-of: commerce-ops
data:
  SPRING_PROFILES_ACTIVE: k8s,oidc
  COMMERCE_SECURITY_MODE: oidc
  OAUTH2_ISSUER_URI: http://keycloak:8080/realms/commerce-ops
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: commerce
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  CONFIG_SERVER_URL: http://config-server:8888
  REQUIRE_WEBHOOK_SECRETS: "true"
  CORS_ALLOWED_ORIGINS: https://admin.example.com,https://shop.example.com
