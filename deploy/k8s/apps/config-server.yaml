apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: commerce-ops
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: commerce-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-server
        app.kubernetes.io/part-of: commerce-ops
    spec:
      containers:
      - name: config-server
        image: commerceops/config-server:0.1.0-SNAPSHOT
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8888
        envFrom:
        - configMapRef:
            name: commerce-ops-config
        - secretRef:
            name: commerce-ops-secrets
            optional: true
        env:
        # Prefer classpath bake-in from the fat jar (config-repo copied at build time)
        - name: CONFIG_SERVER_SEARCH_LOCATIONS
          value: classpath:/config-repo/
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "500m"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: commerce-ops
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: commerce-ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: config-server
  ports:
  - name: http
    port: 8888
    targetPort: http
