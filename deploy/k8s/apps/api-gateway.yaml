apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: commerce-ops
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: commerce-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: commerce-ops
    spec:
      containers:
      - name: api-gateway
        image: commerceops/api-gateway:0.1.0-SNAPSHOT
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: commerce-ops-config
        - secretRef:
            name: commerce-ops-secrets
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 40
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: commerce-ops
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: commerce-ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
